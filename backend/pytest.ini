[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    caja_blanca: Pruebas de caja blanca (estructura interna)
    caja_negra: Pruebas de caja negra (comportamiento externo)
    caja_gris: Pruebas de caja gris (seguridad con conocimiento parcial)
