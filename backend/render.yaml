# Configuración para desplegar el backend en Render (https://render.com)
# Render sí soporta FastAPI con conexión persistente a PostgreSQL.
services:
  - type: web
    name: dashboard-financiero-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Configúrala manualmente en el panel de Render
      - key: SECRET_KEY
        sync: false          # Configúrala manualmente (genera una clave segura)
      - key: CORS_ORIGINS
        sync: false          # Pon la URL de tu frontend en Vercel
      - key: ENVIRONMENT
        value: production
